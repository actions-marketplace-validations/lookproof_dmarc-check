[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "dmarc-check"
dynamic = ["version"]
description = "CI checks for SPF, DMARC, DKIM, MX, MTA-STS and TLS-RPT. CLI and GitHub Action."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [{ name = "Lookproof", email = "github@lookproof.dev" }]
keywords = ["dmarc", "spf", "dkim", "mta-sts", "tls-rpt", "email", "dns", "github-action"]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Environment :: Console",
  "Intended Audience :: System Administrators",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Topic :: Communications :: Email",
  "Topic :: Internet :: Name Service (DNS)",
  "Typing :: Typed",
]
dependencies = ["dnspython>=2.6,<3"]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.6", "mypy>=1.11"]

[project.scripts]
dmarc-check = "dmarc_check.cli:main"

[project.urls]
Homepage = "https://github.com/lookproof/dmarc-check"
Issues = "https://github.com/lookproof/dmarc-check/issues"
Findings = "https://lookproof.dev/findings"

[tool.hatch.version]
path = "src/dmarc_check/__init__.py"

[tool.hatch.build.targets.sdist]
include = ["src", "tests", "README.md", "LICENSE", "action.yml"]

[tool.hatch.build.targets.wheel]
packages = ["src/dmarc_check"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "RUF", "SIM", "BLE"]
ignore = ["S101", "RUF001"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S", "BLE"]

[tool.mypy]
strict = true
python_version = "3.10"
files = ["src", "tests"]

[[tool.mypy.overrides]]
module = ["tests.*"]
disallow_untyped_defs = false
disallow_incomplete_defs = false
disallow_untyped_calls = false

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not network'"
markers = ["network: needs internet access (deselect with -m 'not network'; run with -m network)"]
